<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMC Scanner — No Proxies</title>
<style>
  body { font-family: Arial, sans-serif; background: #1e1e2e; color: #e0e0e0; padding: 1rem; }
  h1 { color: #89b4fa; margin: 0 0 .5rem; }

  /* Filter panel with slider */
  .panel { background: #2a2a3d; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; display: flex; gap: 2rem; flex-wrap: wrap; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 160px; }
  label { font-size: .8rem; color: #a5b4fc; }
  input[type=range] { accent-color: #89b4fa; }

  button { padding: .6rem 1.2rem; background: #89b4fa; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
  button:disabled { opacity: .5; cursor: wait; }

  /* Summary cards */
  .stats { display: flex; gap: 1rem; margin-bottom: .5rem; flex-wrap: wrap; }
  .card { background: #2a2a3d; padding: .6rem 1rem; border-radius: 8px; min-width: 140px; }
  .card b { color: #89b4fa; }

  /* Debug line */
  #debug { color: #fbbf24; font-size: .8rem; margin-bottom: .5rem; }

  /* Results table */
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: .5rem .6rem; text-align: right; border-bottom: 1px solid #3a3a5c; vertical-align: middle; white-space: nowrap; }
  th { background: #2a2a3d; position: sticky; top: 0; }
  td:first-child, th:first-child { text-align: left; }

  /* Confidence bar */
  .bar-bg { background: #3a3a5c; height: 12px; border-radius: 6px; overflow: hidden; width: 80px; display: inline-block; vertical-align: middle; }
  .bar-fill { height: 100%; border-radius: 6px; }

  /* Badges */
  .bull { background: #4ade80; color: #000; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
  .bear { background: #f87171; color: #fff; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
  .neu  { background: #a5b4fc; color: #000; padding: 3px 8px; border-radius: 6px; font-weight: bold; }

  /* Pattern tags */
  .tag { font-size: .75rem; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }
  .tag-bull { background: #22c55e33; color: #4ade80; }
  .tag-bear { background: #f8717133; color: #f87171; }

  img.coin { width: 20px; vertical-align: middle; border-radius: 4px; }
</style>
</head>
<body>

<h1>🔍 SMC Scanner — Single Source, No Proxies</h1>
<p id="status">Click Scan (CoinGecko only — CORS-friendly).</p>

<!-- Tunable mover threshold -->
<div class="panel">
  <div class="field">
    <label>Mover threshold: abs(<b id="vM">3</b>%) in 24h</label>
    <input type="range" id="fM" min="0.5" max="15" value="3" step="0.5" oninput="document.getElementById('vM').textContent=this.value">
  </div>
  <button onclick="run()">Scan Movers</button>
</div>

<div id="debug"></div>
<div class="stats" id="stats"></div>
<table>
  <thead><tr><th>Coin</th><th>Price</th><th>24h %</th><th>Vol ($M)</th><th>Momentum</th><th>Patterns</th><th>Confidence</th><th>Prediction</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<script>
// Stablecoin names to exclude — they don't move, so no setups exist.
var STABLES = ["dollar","usdt","usdc","busd","tusd","dai","frax","fdusd"];

async function run() {
  var btn = document.querySelector("button");
  var st = document.getElementById("status");
  var dbg = document.getElementById("debug");
  btn.disabled = true;

  // ─── STAGE 1: one call gives us stats + hourly sparkline prices ──
  // "sparkline=7d" adds an array of the last 7 days of prices (hourly points).
  // This endpoint allows browser requests — no proxy or CORS issues.
  st.textContent = "Fetching movers with price history...";
  var data = null;

  // Retry up to 3 times in case CoinGecko rate-limits us temporarily.
  for (var a = 1; a <= 3; a++) {
    try {
      var r = await fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1&sparkline=7d");
      if (r.ok) { data = await r.json(); break; } // success — exit loop
    } catch(e) {}
    await new Promise(function(ok){ setTimeout(ok, 10000); }); // wait 10s between retries
  }

  // All retries failed — show a clear message.
  if (!data || !Array.isArray(data)) {
    st.textContent = "❌ CoinGecko unavailable after 3 tries. Wait a few minutes.";
    btn.disabled = true;
    return;
  }

  var mThresh = parseFloat(document.getElementById("fM").value);

  // Keep only coins that moved enough and aren't stablecoins.
  var movers = data.filter(function(c) {
    var name = c.name.toLowerCase();
    for (var i = 0; i < STABLES.length; i++) if (name.indexOf(STABLES[i]) !== -1) return false;
    return Math.abs(parseFloat(c.price_change_percentage_24h || 0)) >= mThresh;
  });

  // Debug: shows exactly how many coins survived the filter.
  dbg.textContent = "Fetched " + data.length + " coins → " + movers.length + " movers (threshold " + mThresh + "%)";

  if (!movers.length) { st.textContent = "No movers — lower threshold."; btn.disabled = false; return; }

  // Sort by movement size so biggest plays appear first, cap at 20.
  movers.sort(function(a, b) { return Math.abs(parseFloat(b.price_change_percentage_24h)) - Math.abs(parseFloat(a.price_change_percentage_24h)); });

  // Analyze each mover using its sparkline history (no extra API calls needed).
  var results = movers.slice(0, 20).map(analyze);

  // Sort by confidence so best setups rise to the top.
  results.sort(function(a, b) { return b.confidence - a.confidence; });
  st.textContent = "Done! " + results.length + " candidates at " + new Date().toLocaleTimeString();
  drawStats(results);
  drawTable(results);
  btn.disabled = false;
}

// ─── STAGE 2: pattern detection from hourly sparkline data ──
function analyze(c) {
  var chg   = parseFloat(c.price_change_percentage_24h || 0); // 24h change %
  var volM  = (parseFloat(c.total_volume || c.volume || 0)) / 1e6; // volume in millions

  var pats = [];
  var spark = c.sparkline_in_7d?.price; // array of hourly prices over ~7 days

  // ─── MOMENTUM ANALYSIS from the last 24 price points (hourly) ──
  if (spark && spark.length >= 24) {
    var recent = spark.slice(-24);   // last 24 hours of prices
    var older  = spark.slice(-48, -24); // 24h before that (for comparison)

    // Average price in each window so we can measure trend direction.
    var avgNow = recent.reduce(function(s,v){ return s+v; }, 0) / recent.length;
    var avgThen = older.reduce(function(s,v){ return s+v; }, 0) / older.length;

    // High and low of the last 24h — needed for sweep detection.
    var h24 = Math.max.apply(null, recent);
    var l24 = Math.min.apply(null, recent);
    var price = recent[recent.length - 1]; // current price (last point)

    // ─── SWEEP DETECTION (SMC concept) ──────────────────────
    // Bullish sweep: price dropped below the earlier average then bounced back above it.
    // Interpretation: stop hunt → reversal → Scenario B setup!
    if (l24 < avgThen && price > avgNow && chg > 0) {
      pats.push({ n: "🔵 Bull Sweep", c: "tag-bull" });
    }

    // Bearish sweep: price pumped above the earlier average then faded back below it.
    if (h24 > avgThen && price < avgNow && chg < 0) {
      pats.push({ n: "🔴 Bear Sweep", c: "tag-bear" });
    }

    // ─── TREND FLAGS ────────────────────────────────────────
    // Price climbing and holding near the 24h high = strong momentum (BOS continuation).
    if (price > h24 * 0.97 && chg > 5) {
      pats.push({ n: "🟢 Momentum", c: "tag-bull" });
    }

    // Price falling and sitting near the 24h low = weak, sellers in control.
    if (price < l24 * 1.03 && chg < -5) {
      pats.push({ n: "🔴 Weak", c: "tag-bear" });
    }

    // ─── RSI-STYLE MOMENTUM (simplified, from price steps) ──
    // Count how many of the last 12 hourly points went up vs down.
    var ups = 0;
    for (var i = recent.length - 12; i < recent.length; i++) {
      if (recent[i] > recent[i-1]) ups++;
    }
    var rsiProxy = (ups / 12) * 100; // rough RSI stand-in: 0 = all down, 100 = all up

    // Oversold bounce: momentum was bearish but price just turned green — Scenario B!
    if (rsiProxy < 35 && chg > 0) pats.push({ n: "🔵 Oversold Bounce", c: "tag-bull" });
    // Overbought fade: strong run but now turning red.
    if (rsiProxy > 75 && chg < 0) pats.push({ n: "🔴 Overbought Fade", c: "tag-bear" });

    // ─── SCORING & PREDICTION ──────────────────────────────
    var score = chg * 0.5; // base momentum score
    pats.forEach(function(p2) {
      var s = (p2.n.indexOf("Bull") !== -1 || p2.n.indexOf("🟢") !== -1) ? 3 : -3;
      score += s;
    });

    var confidence = Math.min(100, Math.abs(score) * 7); // scale to 0-100%

    // Final prediction based on score strength and a confidence floor.
    var pred, pcls;
    if (score > 5 && confidence > 35)     { pred = "🟢 Bullish"; pcls = "bull"; }
    else if (score < -5 && confidence > 35){ pred = "🔴 Bearish"; pcls = "bear"; }
    else                                  { pred = "⚪ Neutral"; pcls = "neu"; }

    return { name: c.name + " (" + c.symbol.toUpperCase() + ")", img: c.image || "", price: c.current_price, chg: chg, volM: volM, rsi: Math.round(rsiProxy), patterns: pats, confidence: confidence, pred: pred, pcls: pcls };
  }

  // No sparkline data — return a neutral result so the coin still shows up.
  return { name: c.name + " (" + c.symbol.toUpperCase() + ")", img: c.image || "", price: c.current_price, chg: chg, volM: volM, rsi: "—", patterns: [], confidence: 20, pred: "⚪ No history", pcls: "neu" };
}

// Summary cards counting each prediction type.
function drawStats(list) {
  var s = { bull: 0, bear: 0, neu: 0 };
  list.forEach(function(r) { if (r.pcls === "bull") s.bull++; else if (r.pcls === "bear") s.bear++; else s.neu++; });
  document.getElementById("stats").innerHTML = '<div class="card"><b>🟢 Bullish:</b> '+s.bull+'</div><div class="card"><b>🔴 Bearish:</b> '+s.bear+'</div><div class="card"><b>⚪ Neutral:</b> '+s.neu+'</div>';
}

// Build table rows with pattern tags and a confidence bar per coin.
function drawTable(list) {
  var tbody = document.getElementById("rows");
  tbody.innerHTML = "";
  list.forEach(function(r) {
    var tr = document.createElement("tr");
    var bc = r.pcls === "bull" ? "#4ade80" : r.pcls === "bear" ? "#f87171" : "#a5b4fc";

    // Join pattern tags as small colored labels.
    var ph = r.patterns.map(function(p2){ return '<span class="tag '+p2.c+'">'+p2.n+'</span>'; }).join("");

    tr.innerHTML = '<td>' + (r.img ? '<img class="coin" src="'+r.img+'" />' : "") + r.name + '</td>' +
      '<td>$'+fmt(r.price)+'</td>' +
      '<td style="color:'+(r.chg>=0?"#4ade80":"#f87171")+'">'+r.chg.toFixed(2)+"%</td>" +
      '<td>'+r.volM.toFixed(1)+"M</td><td>"+r.rsi+'</td>' +
      '<td>'+(ph||"&#8212;")+'</td>' +
      '<td><div class="bar-bg"><div class="bar-fill" style="width:'+r.confidence+'%;background:'+bc+'"></div> '+Math.round(r.confidence)+"%</div></td>" +
      '<td><span class="'+r.pcls+'">'+r.pred+'</span></td>';

    tbody.appendChild(tr);
  });
}

function fmt(n) { return n >= 1000 ? (n/1000).toFixed(1)+"K" : n < 0.01 ? n.toFixed(6) : n.toFixed(4); }
</script>
</body>
</html>
