<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMC Scanner — Binance + CORS Proxy</title>
<style>
  body { font-family: Arial, sans-serif; background: #1e1e2e; color: #e0e0e0; padding: 1rem; }
  h1 { color: #89b4fa; margin: 0 0 .5rem; }

  /* Header with filter controls */
  .header { background: #2a2a3d; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 160px; }
  label { font-size: .8rem; color: #a5b4fc; }

  select, button { padding: .5rem .8rem; background: #3a3a5c; border: 1px solid #4a4a7c; border-radius: 6px; cursor: pointer; font-weight: bold; color: #e0e0e0; }
  select:focus { outline: none; border-color: #89b4fa; }
  button { background: #89b4fa; border: none; }
  button:disabled { opacity: .5; cursor: wait; }

  /* Summary cards */
  .stats { display: flex; gap: 1rem; margin-bottom: .5rem; flex-wrap: wrap; }
  .card { background: #2a2a3d; padding: .6rem 1rem; border-radius: 8px; min-width: 140px; }
  .card b { color: #89b4fa; }

  /* Debug line */
  #debug { color: #fbbf24; font-size: .8rem; margin-bottom: .5rem; white-space: pre-wrap; max-height: 100px; overflow-y: auto; background: #1e1e2e; padding: .5rem; border-radius: 6px; }

  /* Results table with inline chart */
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: .5rem .6rem; text-align: right; border-bottom: 1px solid #3a3a5c; vertical-align: middle; white-space: nowrap; }
  th { background: #2a2a3d; position: sticky; top: 0; cursor: pointer; user-select: none; }
  td:first-child, th:first-child { text-align: left; }

  /* Sparkline chart inside table cell */
  .chart-cell { width: 140px; }
  canvas.chart { display: block; margin: auto; border-radius: 6px; background: #2a2a3d; cursor: pointer; }

  /* Confidence bar */
  .bar-bg { background: #3a3a5c; height: 12px; border-radius: 6px; overflow: hidden; width: 80px; display: inline-block; vertical-align: middle; }
  .bar-fill { height: 100%; border-radius: 6px; }

  /* Badges */
  .bull { background: #4ade80; color: #000; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
  .bear { background: #f87171; color: #fff; padding: 3px 8px; border-radius: 6px; font-weight: bold; }
  .neu  { background: #a5b4fc; color: #000; padding: 3px 8px; border-radius: 6px; font-weight: bold; }

  /* Pattern tags */
  .tag { font-size: .75rem; padding: 2px 6px; border-radius: 4px; margin-left: 4px; }
  .tag-bull { background: #22c55e33; color: #4ade80; }
  .tag-bear { background: #f8717133; color: #f87171; }

  img.coin { width: 20px; vertical-align: middle; border-radius: 4px; }

  /* ─── DETAIL PANEL (expanded analysis) ────────────── */
  .detail-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.7); z-index: 100; display: none; overflow-y: auto; }
  .detail-panel { max-width: 960px; margin: 2rem auto; background: #1e1e2e; border-radius: 12px; padding: 2rem; position: relative; }
  .close-btn { position: absolute; top: 1rem; right: 1.5rem; font-size: 1.5rem; cursor: pointer; color: #89b4fa; background: none; border: none; }
  .detail-title { color: #89b4fa; font-size: 1.3rem; margin-bottom: 1rem; }

  /* Tabs inside detail panel */
  .tabs { display: flex; gap: .5rem; margin-bottom: 1rem; border-bottom: 2px solid #3a3a5c; padding-bottom: .5rem; }
  .tab-btn { background: none; border: none; color: #a5b4fc; font-size: .9rem; cursor: pointer; padding: .5rem 1rem; border-radius: 6px 6px 0 0; }
  .tab-btn.active { background: #2a2a3d; color: #89b4fa; }

  /* Tab content */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Analysis sections inside tabs */
  .section { margin-bottom: 1.5rem; padding: 1rem; background: #2a2a3d; border-radius: 8px; }
  .section h3 { color: #89b4fa; margin-top: 0; font-size: 1rem; }
  .section p, .section li { line-height: 1.6; }
  .section ul { padding-left: 1.5rem; }

  /* Links in analysis */
  a { color: #89b4fa; text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Indicator values table inside detail panel */
  .ind-table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
  .ind-table td, .ind-table th { padding: .4rem .6rem; border-bottom: 1px solid #3a3a5c; text-align: left; font-size: .85rem; }

  /* Trade setup cards */
  .setup-card { background: #2a2a3d; border-radius: 8px; padding: 1rem; margin-bottom: .5rem; border-left: 4px solid #89b4fa; }
  .setup-card.long { border-left-color: #4ade80; }
  .setup-card.short { border-left-color: #f87171; }

  /* Market stats grid */
  .market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .5rem; margin-top: .5rem; }
  .mstat { background: #3a3a5c; padding: .6rem; border-radius: 6px; text-align: center; }
  .mstat b { display: block; color: #89b4fa; font-size: .8rem; }

  /* Error styling */
  .err { color: #f87171; }
</style>
</head>
<body>

<h1>🔍 SMC Scanner — Binance Candles (CORS Proxy)</h1>
<p id="status">Click Scan to find the movers.</p>

<!-- ─── HEADER FILTERS ──────────────────────────────── -->
<div class="header">
  <div class="field">
    <label>Crypto Type</label>
    <select id="fType">
      <option value="spot" selected>Spot (USDT pairs)</option>
      <option value="derivatives">Derivatives / Perps</option>
      <option value="all">All Markets</option>
    </select>
  </div>

  <div class="field">
    <label>Stablecoins</label>
    <select id="fStable">
      <option value="exclude" selected>Exclude from results</option>
      <option value="include">Include in results</option>
    </select>
  </div>

  <div class="field">
    <label>Mover threshold: abs(<b id="vM">3</b>%) in 24h</label>
    <input type="range" id="fM" min="0.5" max="15" value="3" step="0.5" oninput="document.getElementById('vM').textContent=this.value">
  </div>

  <div class="field">
    <label>Max results</label>
    <select id="fCount">
      <option value="5">5 coins</option>
      <option value="10" selected>10 coins</option>
      <option value="20">20 coins</option>
    </select>
  </div>

  <button onclick="run()">Scan Movers</button>
</div>

<div id="debug"></div>
<div class="stats" id="stats"></div>
<table>
  <thead><tr><th>Coin</th><th>Price</th><th>24h %</th><th>Vol ($M)</th><th>RSI(14)</th><th>Chart</th><th>Patterns</th><th>Confidence</th><th>Prediction</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<!-- ─── DETAIL PANEL OVERLAY (hidden by default) ────── -->
<div class="detail-overlay" id="overlay">
  <div class="detail-panel">
    <button class="close-btn" onclick="closeDetail()">✕</button>
    <h2 class="detail-title" id="detailTitle"></h2>

    <!-- Tabs: Overview | Analysis | Trade Setups | Market Data -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="overview">Overview</button>
      <button class="tab-btn" data-tab="analysis">Technical Analysis</button>
      <button class="tab-btn" data-tab="setups">Trade Setups</button>
      <button class="tab-btn" data-tab="market">Market Data</button>
    </div>

    <!-- Tab: Overview -->
    <div class="tab-content active" id="tab-overview"></div>

    <!-- Tab: Technical Analysis (detailed) -->
    <div class="tab-content" id="tab-analysis"></div>

    <!-- Tab: Trade Setups -->
    <div class="tab-content" id="tab-setups"></div>

    <!-- Tab: Market Data / Links -->
    <div class="tab-content" id="tab-market"></div>
  </div>
</div>

<script>
// Stablecoin name fragments to exclude from scanning.
var STABLES = ["dollar","usdt","usdc","busd","tusd","dai","frax","fdusd"];

// CORS proxy — Binance blocks browser requests directly, so we route through one.
var PROXY_URL = "https://corsproxy.io/?"; // free public proxy that works from GitHub Pages.

var DEBUG_LOG = []; // collect all debug messages for display.

function log(msg, isError) {
  var ts = new Date().toLocaleTimeString();
  DEBUG_LOG.push((isError ? "[ERR] " : "[OK] ") + msg);
  document.getElementById("debug").textContent = DEBUG_LOG.join("\n");
}

async function run() {
  var btn = document.querySelector("button");
  var st = document.getElementById("status");
  btn.disabled = true;
  DEBUG_LOG = []; // clear previous logs.

  log("=== SCAN STARTED ===", false);

  // Read filter values.
  var mThresh   = parseFloat(document.getElementById("fM").value);
  var excludeSt = document.getElementById("fStable").value === "exclude";
  var maxCount  = parseInt(document.getElementById("fCount").value);

  log("Filters: threshold=" + mThresh + "%, exclude_stables=" + excludeSt + ", max_results=" + maxCount, false);

  // ─── STAGE 1: gross pick — fast overview of top coins ──
  st.textContent = "Stage 1: fetching movers...";
  log("Stage 1: calling CoinGecko /coins/markets...", false);
  var data = null;

  for (var a = 1; a <= 3 && !data; a++) {
    try {
      // CoinGecko /coins/markets with sparkline=7d gives us hourly price history.
      var r = await fetch("https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=250&page=1");
      if (r.ok) { data = await r.json(); log("Stage 1: fetched " + data.length + " coins", false); break; }
      else { log("Stage 1: API returned status " + r.status, true); }
    } catch(e) { log("Stage 1: fetch error — " + e.message, true); }
    if (!data && a < 3) await new Promise(function(ok){ setTimeout(ok, 10000); });
  }

  if (!data || !Array.isArray(data)) { st.textContent = "❌ CoinGecko unavailable after 3 tries."; log("Stage 1: FAILED — no data", true); btn.disabled = false; return; }

  // Filter: remove stablecoins unless user wants them.
  var movers = data.filter(function(c) {
    if (excludeSt) {
      var name = c.name.toLowerCase();
      for (var i = 0; i < STABLES.length; i++) if (name.indexOf(STABLES[i]) !== -1) return false;
    }
    return Math.abs(parseFloat(c.price_change_percentage_24h || 0)) >= mThresh;
  });

  // Sort biggest movers first, cap at user's max count.
  movers.sort(function(a, b) { return Math.abs(parseFloat(b.price_change_percentage_24h||0)) - Math.abs(parseFloat(a.price_change_percentage_24h||0)); });
  var top = movers.slice(0, maxCount);

  log("Stage 1: " + data.length + " coins → " + top.length + " selected for deep analysis", false);

  // ─── STAGE 2: technical analysis — real hourly candles from Binance via CORS proxy ──
  st.textContent = "Stage 2: fetching candle data (Binance via proxy)...";
  var results = [];

  for (var i = 0; i < top.length; i++) {
    log("Stage 2: fetching OHLC for #" + (i+1) + "/" + top.length + " — " + top[i].name + " (" + top[i].id + ")", false);

    // Binance klines endpoint returns [timestamp, open, high, low, close, volume] arrays.
    var sym = (top[i].symbol || "").toUpperCase() + "USDT";
    log("  Calling Binance via proxy: /api/v3/klines?symbol=" + sym + "&interval=1h&limit=50", false);

    var ohlc = null;
    try {
      // Route through CORS proxy so the browser can reach Binance.
      var r2 = await fetch(PROXY_URL + encodeURIComponent("https://api.binance.com/api/v3/klines?symbol=" + sym + "&interval=1h&limit=50"));
      if (r2.ok) {
        ohlc = await r2.json(); // array of [ts, o, h, l, c, v] arrays.
        log("  Binance returned: " + (ohlc ? ohlc.length + " candles" : "null"), false);
      } else {
        var errText = await r2.text();
        log("  Binance API error — status " + r2.status + ": " + errText.substring(0, 150), true);
      }
    } catch(e) {
      log("  Binance fetch error — " + e.message, true);
    }

    // Analyze this coin.
    var result = null;
    try {
      result = analyze(top[i], ohlc);
      log("  Analysis complete: RSI=" + (result.rsi || "?") + ", patterns=" + (result.patterns ? result.patterns.length : "null"), false);
    } catch(e) {
      log("  Analysis ERROR for " + top[i].name + " — " + e.message, true);
      // Create a minimal fallback so we don't lose the coin entirely.
      result = { name: top[i].name + " (" + (top[i].symbol||"").toUpperCase() + ")", img: top[i].image || "", price: top[i].current_price, chg: parseFloat(top[i].price_change_percentage_24h||0), volM: 0, rsi: "?", patterns: [], confidence: 10, pred: null, sparkData: [], atr: "—", stochK: "—", macdSignal: "—", h24: "—", l24: "—" };
    }

    results.push(result);

    // Small pause between calls to stay polite to the API.
    await new Promise(function(ok){ setTimeout(ok, 600); });
  }

  log("Stage 2: complete — " + results.length + " coins analyzed", false);

  // Sort by confidence so best setups rise to the top.
  results.sort(function(a, b) { return (b.confidence||0) - (a.confidence||0); });
  st.textContent = "Done! " + results.length + " candidates at " + new Date().toLocaleTimeString();

  drawStats(results);
  drawTable(results);
  btn.disabled = false;
}

// ─── STAGE 3: RSI + hammer/engulfing detection + prediction ──
function analyze(c, ohlc) {
  var chg   = parseFloat(c.price_change_percentage_24h || 0); // 24h change %
  var volM  = (parseFloat(c.total_volume || c.volume || 0)) / 1e6; // volume in millions

  var rsi = 50, pats = []; // defaults if candle data is missing.
  var atrVal = 0, stochK = 50, macdSignal = 0;

  // Only run pattern detection when we actually got candles back.
  if (ohlc && ohlc.length >= 30) {
    // Compute RSI(14) from hourly closes: average gain vs average loss over last 14 bars.
    var gains = 0, losses = 0;
    for (var i = ohlc.length - 14; i < ohlc.length; i++) {
      // Binance format is [timestamp, open, high, low, close, volume] — index 4 is the close.
      var d = parseFloat(ohlc[i][4]) - parseFloat(ohlc[Math.max(0,i-1)][4]); // change from prior close.
      if (d > 0) gains += d; else losses -= d;
    }
    var ag = gains / 14, al = losses / 14;
    rsi = al === 0 ? 100 : 100 - (100 / (1 + ag / al)); // standard RSI formula.

    // Check the last two candles for reversal patterns.
    var k = candle(ohlc[ohlc.length - 1]); // current candle.
    var p = candle(ohlc[ohlc.length - 2]); // previous candle.

    // Hammer: green close, long lower wick (at least 2x the body), short upper wick — bullish reversal sign.
    if (k.green && k.body > 0 && k.lw >= 2 * k.body && k.uw < k.lw) {
      pats.push({ n: "Hammer", c: "tag-bull" });
    }

    // Bullish engulfing: prior red candle fully swallowed by current green one.
    if (k.green && !p.green && k.body > p.body && k.open < p.close && k.cl > p.open) {
      pats.push({ n: "Bull Engulf", c: "tag-bull" });
    }

    // Bearish inverted hammer: red candle with long upper wick — exhaustion at top.
    if (!k.green && k.body > 0 && k.uw >= 2 * k.body) {
      pats.push({ n: "Inv Hammer", c: "tag-bear" });
    }

    // ─── SWEEP DETECTION from hourly high/low ──────────────
    var h24 = Math.max.apply(null, ohlc.slice(-24).map(function(x){ return parseFloat(x[2]); })); // 24h high.
    var l24 = Math.min.apply(null, ohlc.slice(-24).map(function(x){ return parseFloat(x[3]); })); // 24h low.
    var price = parseFloat(ohlc[ohlc.length - 1][4]); // current close.

    // Baseline: average of closes from 48-72 hours ago as a reference level.
    var older = ohlc.slice(-72, -48);
    if (older.length > 0) {
      var avgOlder = older.reduce(function(s,v){ return s + parseFloat(v[4]); }, 0) / older.length;

      // Bullish sweep: price dipped below the older average then recovered above it — stop hunt reversal.
      if (l24 < avgOlder && price > avgOlder && chg > 0) pats.push({ n: "🔵 Bull Sweep", c: "tag-bull" });
      // Bearish sweep: pumped above older average then faded back below — liquidity raid rejection.
      if (h24 > avgOlder && price < avgOlder && chg < 0) pats.push({ n: "🔴 Bear Sweep", c: "tag-bear" });
    }

    // ─── MOMENTUM FLAGS from hourly data ──────────────────
    var recent = ohlc.slice(-24); // last 24h candles.
    if (recent.length >= 12) {
      var ups = 0;
      for (var j = recent.length - 12; j < recent.length; j++) {
        if (parseFloat(recent[j][4]) > parseFloat(recent[Math.max(0,j-1)][4])) ups++;
      }
      // RSI-style momentum: how many of the last 12 hourly bars went up.
      var mom = Math.round((ups / 12) * 100);

      if (mom > 85 && chg > 0) pats.push({ n: "🟢 Strong Momentum", c: "tag-bull" });
      if (mom < 15 && chg < 0) pats.push({ n: "🔴 Weak Momentum", c: "tag-bear" });
    }

    // ─── SUPPLEMENTARY INDICATORS from hourly data ──────
    var atrSum = 0;
    for (var i = ohlc.length - 14; i < ohlc.length; i++) {
      var h = parseFloat(ohlc[i][2]), l = parseFloat(ohlc[i][3]);
      var prevClose = parseFloat(ohlc[Math.max(0,i-1)][4]);
      atrSum += Math.max(h - l, Math.abs(h - prevClose), Math.abs(l - prevClose));
    }
    atrVal = atrSum / 14;

    // Stochastic %K: (close - lowN) / (highN - lowN).
    var hN = Math.max.apply(null, ohlc.slice(-20).map(function(x){ return parseFloat(x[2]); }));
    var lN = Math.min.apply(null, ohlc.slice(-20).map(function(x){ return parseFloat(x[3]); }));
    stochK = (hN === lN) ? 50 : ((price - lN) / (hN - lN)) * 100;

    // MACD proxy: EMA(9) vs EMA(26) of closes.
    var ema9 = emaCalc(ohlc, 9), ema26 = emaCalc(ohlc, 26);
    macdSignal = ((ema9 - ema26) / price) * 100; // normalized as % for readability.

    return { name: c.name + " (" + (c.symbol||"").toUpperCase() + ")", img: c.image || "", price: c.current_price, chg: chg, volM: volM, rsi: Math.round(rsi), patterns: pats, confidence: 0, pred: null, sparkData: ohlc.slice(-24).map(function(x){ return parseFloat(x[4]); }),
             atr: atrVal.toFixed(3), stochK: Math.round(stochK), macdSignal: macdSignal.toFixed(1), h24: price.toFixed(4), l24: l24.toFixed(4) };
  }

  // No candle data — return a neutral result so the coin still shows up.
  return { name: c.name + " (" + (c.symbol||"").toUpperCase() + ")", img: c.image || "", price: c.current_price, chg: chg, volM: volM, rsi: "—", patterns: [], confidence: 20, pred: null, sparkData: [], atr: "—", stochK: "—", macdSignal: "—", h24: "—", l24: "—" };
}

// Simple EMA helper for MACD calculation.
function emaCalc(data, period) {
  var k = 2 / (period + 1);
  var prevClose = parseFloat(data[data.length - period][4]); // SMA as initial value.
  for (var i = data.length - period; i < data.length; i++) {
    var c = parseFloat(data[i][4]);
    prevClose = k * c + (1 - k) * prevClose;
  }
  return prevClose;
}

// Helper: unpack a candle [ts,o,h,l,c,v] into readable fields for pattern math.
function candle(k) {
  var o = parseFloat(k[1]), h = parseFloat(k[2]), l = parseFloat(k[3]), cl = parseFloat(k[4]);
  return { open: o, cl: cl, green: cl > o, body: Math.abs(cl - o), lw: Math.min(o,cl) - l, uw: h - Math.max(o,cl) };
}

// Summary cards counting each prediction type — FIXED: called AFTER drawTable sets pred.
function drawStats(list) {
  var s = { bull: 0, bear: 0, neu: 0 };
  list.forEach(function(r) {
    if (r.pred === "bull") s.bull++;
    else if (r.pred === "bear") s.bear++;
    else s.neu++; // includes both explicitly neutral AND any with pred=null.
  });
  document.getElementById("stats").innerHTML = '<div class="card"><b>🟢 Bullish:</b> '+s.bull+'</div><div class="card"><b>🔴 Bearish:</b> '+s.bear+'</div><div class="card"><b>⚪ Neutral:</b> '+s.neu+'</div>';
}

// Draw a tiny sparkline chart on canvas for each coin.
function drawChart(canvas, data, color) {
  if (!data || !data.length) return; // nothing to draw.

  var w = canvas.width, h = canvas.height;
  var ctx = canvas.getContext("2d");

  // Clear the canvas.
  ctx.clearRect(0, 0, w, h);

  // Find min/max for scaling.
  var mn = Math.min.apply(null, data), mx = Math.max.apply(null, data);
  if (mx === mn) { mx = mn + 1; } // avoid divide-by-zero.

  // Draw the line path.
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  for (var i = 0; i < data.length; i++) {
    var x = (i / (data.length - 1)) * w;
    var y = h - ((data[i] - mn) / (mx - mn)) * (h - 4); // leave some padding.
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Fill under the line with a gradient for visual polish.
  var grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + "33"); // semi-transparent fill.
  grad.addColorStop(1, "transparent");

  ctx.lineTo(w, h);
  ctx.lineTo(0, h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
}

// Build table rows with pattern tags and a confidence bar per coin.
function drawTable(list) {
  var tbody = document.getElementById("rows");
  tbody.innerHTML = "";
  list.forEach(function(r, idx) {
    // Compute real prediction based on score logic (moved from analyze so we have all data).
    var score = r.chg * 0.5;
    if (typeof r.rsi === "number") {
      if (r.rsi < 30 && r.chg > 0)   score += 4; // oversold bounce — Scenario B!
      if (r.rsi > 70 && r.chg < 0)   score -= 4; // overbought rejection.
    }
    r.patterns.forEach(function(p2) { score += (p2.n.indexOf("Bull") !== -1 || p2.n === "Hammer") ? 3 : -3; });

    var confidence = Math.min(100, Math.abs(score) * 7); // scale to 0-100%.
    r.confidence = confidence;

    // Final prediction based on score strength and a confidence floor.
    if (score > 5 && confidence > 35)     { r.pred = "bull"; }
    else if (score < -5 && confidence > 35){ r.pred = "bear"; }
    else                                  { r.pred = "neu"; }

    var bc = r.pred === "bull" ? "#4ade80" : r.pred === "bear" ? "#f87171" : "#a5b4fc";

    // Join pattern tags as small colored labels.
    var ph = r.patterns.map(function(p2){ return '<span class="tag '+p2.c+'">'+p2.n+'</span>'; }).join("");

    var tr = document.createElement("tr");
    tr.innerHTML = '<td>' + (r.img ? '<img class="coin" src="'+r.img+'" />' : "") + r.name + '</td>' +
      '<td>$'+fmt(r.price)+'</td>' +
      '<td style="color:'+(r.chg>=0?"#4ade80":"#f87171")+'">'+r.chg.toFixed(2)+"%</td>" +
      '<td>'+r.volM.toFixed(1)+"M</td><td>"+r.rsi+'</td>' +
      '<td class="chart-cell"><canvas id="c'+idx+'" class="chart" width="140" height="50"></canvas></td>' +
      '<td>'+(ph||"&#8212;")+'</td>' +
      '<td><div class="bar-bg"><div class="bar-fill" style="width:'+r.confidence+'%;background:'+bc+'"></div> '+Math.round(r.confidence)+"%</div></td>" +
      '<td><span class="'+(r.pred==='bull'?'bull':r.pred==='bear'?'bear':'neu')+'">'+(r.pred==='bull'?"🟢 Bullish":r.pred==='bear'?"🔴 Bearish":"⚪ Neutral")+'</span></td>';

    tbody.appendChild(tr);

    // Draw the sparkline chart after the row is inserted into DOM.
    if (r.sparkData && r.sparkData.length > 1) {
      var cvs = document.getElementById("c" + idx);
      drawChart(cvs, r.sparkData, bc);
    }
  });

  // ─── Attach click handlers to canvas elements for detail panel ──
  list.forEach(function(r, idx) {
    var cvs = document.getElementById("c" + idx);
    if (cvs && cvs.width > 0) cvs.addEventListener("click", function(){ showDetail(list[idx], r); });
  });
}

// ─── DETAIL PANEL: open overlay with tabs ──────────────
function showDetail(coin, data) {
  var ov = document.getElementById("overlay");
  document.getElementById("detailTitle").textContent = coin.name + " (" + coin.symbol.toUpperCase() + ")";

  // Populate Overview tab.
  document.getElementById("tab-overview").innerHTML = buildOverview(data);

  // Populate Technical Analysis tab.
  document.getElementById("tab-analysis").innerHTML = buildAnalysis(data);

  // Populate Trade Setups tab.
  document.getElementById("tab-setups").innerHTML = buildSetups(data);

  // Populate Market Data / Links tab.
  document.getElementById("tab-market").innerHTML = buildMarket(data, coin);

  ov.style.display = "block";
}

function closeDetail() {
  document.getElementById("overlay").style.display = "none";
}

// Tab switching logic.
document.addEventListener("click", function(e) {
  if (e.target.classList.contains("tab-btn")) {
    var tabId = e.target.getAttribute("data-tab");
    // Deactivate all tabs and contents.
    document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
    document.querySelectorAll(".tab-content").forEach(function(c){ c.classList.remove("active"); });
    // Activate clicked tab.
    e.target.classList.add("active");
    document.getElementById("tab-" + tabId).classList.add("active");
  }
});

// ─── TAB CONTENT BUILDERS ──────────────────────────────

function buildOverview(d) {
  return '<div class="section"><h3>📊 Quick Overview</h3>' +
    '<table class="ind-table">' +
    '<tr><td>Current Price</td><td>$' + fmt(d.price) + '</td></tr>' +
    '<tr><td>24h Change</td><td style="color:'+(d.chg>=0?"#4ade80":"#f87171")+'">' + d.chg.toFixed(2) + '%</td></tr>' +
    '<tr><td>RSI (14)</td><td>' + d.rsi + '</td></tr>' +
    '<tr><td>ATR (14 hourly)</td><td>$' + d.atr + '</td></tr>' +
    '<tr><td>Stochastic %K</td><td>' + d.stochK + '%</td></tr>' +
    '<tr><td>MACD Signal</td><td>' + d.macdSignal + '%</td></tr>' +
    '</table></div>';
}

function buildAnalysis(d) {
  var html = '<div class="section"><h3>📈 Technical Indicators Summary</h3>';

  // RSI interpretation.
  if (typeof d.rsi === "number") {
    var rsiNote = "";
    if (d.rsi < 30)       rsiNote = "⬇️ Oversold — potential bounce setup.";
    else if (d.rsi > 70)  rsiNote = "⬆️ Overbought — watch for rejection.";
    else                  rsiNote = "➡️ Neutral zone — no extreme momentum.";
    html += '<p><b>RSI(14):</b> ' + d.rsi + ' — ' + rsiNote + '</p>';
  }

  // Stochastic interpretation.
  if (typeof d.stochK === "number") {
    var stochNote = "";
    if (d.stochK < 20)      stochNote = "⬇️ Deep oversold — reversal potential.";
    else if (d.stochK > 80) stochNote = "⬆️ Overbought — pullback risk.";
    else                    stochNote = "➡️ Normal range.";
    html += '<p><b>Stochastic %K:</b> ' + d.stochK + '% — ' + stochNote + '</p>';
  }

  // MACD interpretation.
  if (typeof d.macdSignal === "number") {
    var macdNote = "";
    if (d.macdSignal > 0)   macdNote = "🟢 Bullish momentum — EMA(9) above EMA(26).";
    else                    macdNote = "🔴 Bearish momentum — EMA(9) below EMA(26).";
    html += '<p><b>MACD (EMA 9 vs 26):</b> ' + d.macdSignal.toFixed(1) + '% — ' + macdNote + '</p>';
  }

  // ATR interpretation.
  if (typeof d.atr === "number") {
    var atrPct = ((parseFloat(d.atr) / parseFloat(d.price)) * 100).toFixed(1);
    html += '<p><b>ATR(14):</b> $' + d.atr + ' (~' + atrPct + '% of price) — ' + (atrPct > 2 ? "High volatility, wider SL needed." : "Low volatility, tight SL possible.") + '</p>';
  }

  // Pattern summary.
  html += '<h3>🕯️ Detected Patterns</h3><ul>';
  if (d.patterns.length === 0) {
    html += '<li>No reversal patterns detected in the last 2 candles.</li>';
  } else {
    d.patterns.forEach(function(p) {
      html += '<li class="' + p.c.replace("tag-","") + '">' + p.n + '</li>';
    });
  }
  html += '</ul></div>';

  // SMC context.
  html += '<div class="section"><h3>🎯 SMC Context</h3><p>' +
    (d.chg > 5 ? "Strong bullish momentum — watch for pullback entry at support." : "") +
    (d.chg < -5 ? "Strong bearish pressure — watch for bounce entry at support or continuation short." : "") +
    "</p></div>";

  return html;
}

function buildSetups(d) {
  var html = '<h3>📋 Potential Trade Setups</h3>';

  // Long setup conditions.
  if (d.chg > 0 && typeof d.rsi === "number" && d.rsi < 40) {
    var slLong = fmt(parseFloat(d.price) - parseFloat(d.atr));
    html += '<div class="setup-card long"><h3>🟢 Long Setup — Oversold Bounce</h3>' +
      '<p><b>Entry:</b> Retest of support ($' + d.l24 + ' or lower)</p>' +
      '<p><b>Stop Loss:</b> $' + slLong + '</p>' +
      '<p><b>TP1:</b> $' + fmt(parseFloat(d.price) * 1.03) + ' (3%)</p>' +
      '<p><b>TP2:</b> $' + fmt(parseFloat(d.price) * 1.06) + ' (6%)</p>' +
      '<p><b>Rationale:</b> RSI oversold at ' + d.rsi + ', potential bounce back toward mean.</p></div>';
  }

  // Short setup conditions.
  if (d.chg < 0 && typeof d.rsi === "number" && d.rsi > 65) {
    var slShort = fmt(parseFloat(d.price) + parseFloat(d.atr));
    html += '<div class="setup-card short"><h3>🔴 Short Setup — Overbought Rejection</h3>' +
      '<p><b>Entry:</b> Retest of resistance ($' + d.h24 + ' or higher)</p>' +
      '<p><b>Stop Loss:</b> $' + slShort + '</p>' +
      '<p><b>TP1:</b> $' + fmt(parseFloat(d.price) * 0.97) + ' (3%)</p>' +
      '<p><b>TP2:</b> $' + fmt(parseFloat(d.price) * 0.94) + ' (6%)</p>' +
      '<p><b>Rationale:</b> RSI overbought at ' + d.rsi + ', potential rejection.</p></div>';
  }

  // Breakout setup.
  if (d.chg > 5 && typeof d.macdSignal === "number" && d.macdSignal > 0) {
    html += '<div class="setup-card long"><h3>🚀 Breakout Continuation</h3>' +
      '<p><b>Entry:</b> Above $' + d.h24 + ' with volume confirmation.</p>' +
      '<p><b>Stop Loss:</b> Below $' + fmt(parseFloat(d.price) - parseFloat(d.atr)) + '</p>' +
      '<p><b>Rationale:</b> Strong momentum with bullish MACD — trend continuation play.</p></div>';
  }

  // No setups message.
  if (html.indexOf("setup-card") === -1) {
    html += '<p>No clear setup detected right now. Wait for a confirmed pattern or RSI extreme before entering.</p>';
  }

  return html;
}

function buildMarket(d, coin) {
  var html = '<div class="section"><h3>🌐 Trading & Links</h3><ul>' +
    // CoinGecko link.
    '<li><a href="https://www.coingecko.com/en/coins/' + coin.id + '" target="_blank">CoinGecko — ' + coin.name + '</a></li>' +
    // CoinMarketCap link (if available).
    '<li><a href="https://coinmarketcap.com/currencies/' + (coin.symbol || "").toLowerCase() + '/" target="_blank">CoinMarketCap</a></li>' +
    // DexScreener link.
    '<li><a href="https://dexscreener.com/?search=' + (coin.symbol || "").toUpperCase() + '" target="_blank">DexScreener — DEX pairs</a></li>';

  if (coin.homepage) html += '<li><b>Official Website:</b> <a href="' + coin.homepage[0] + '" target="_blank">' + coin.homepage[0] + '</a></li>';
  if (coin.twitter_screen_name) html += '<li><b>Twitter/X:</b> <a href="https://twitter.com/' + coin.twitter_screen_name + '" target="_blank">@' + coin.twitter_screen_name + '</a></li>';

  html += '</ul></div>';

  // Market stats.
  html += '<div class="section"><h3>📊 Market Stats</h3><div class="market-grid">' +
    '<div class="mstat"><b>Current Price</b>$' + fmt(d.price) + '</div>' +
    '<div class="mstat"><b>24h High</b>$' + d.h24 + '</div>' +
    '<div class="mstat"><b>24h Low</b>$' + d.l24 + '</div>' +
    '<div class="mstat"><b>24h Volume</b>$' + d.volM.toFixed(1) + 'M</div>' +
    '<div class="mstat"><b>ATH Distance</b>' + ((d.price - coin.ath || 0) / (coin.ath || 1) * 100).toFixed(1) + '%</div>' +
    '</div></div>';

  return html;
}

function fmt(n) { return n >= 1000 ? (n/1000).toFixed(1)+"K" : n < 0.01 ? n.toFixed(6) : n.toFixed(4); }
</script>
